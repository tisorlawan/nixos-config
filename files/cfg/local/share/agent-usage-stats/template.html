<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codex token usage</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fbfbfa;
    --panel: #ffffff;
    --ink: #1a1a18;
    --muted: #6b6b64;
    --line: #e4e3de;
    --accent: #3d62b3;
    --accent-soft: #dbe3f4;
    --cache: #2f7d63;
    --fresh: #b5702a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131316;
      --panel: #1c1c20;
      --ink: #ececed;
      --muted: #9a9a95;
      --line: #2e2e34;
      --accent: #7d9ce0;
      --accent-soft: #2a3550;
      --cache: #6bbf9c;
      --fresh: #d9a05f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2rem 1.5rem 4rem;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 68rem; margin: 0 auto; }
  h1 { font-size: 1.35rem; font-weight: 600; margin: 0 0 .25rem; letter-spacing: -.01em; }
  .sub { color: var(--muted); font-size: .85rem; margin-bottom: 2rem; }
  .cards { display: grid; gap: .75rem; grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr)); margin-bottom: 2.5rem; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: .5rem; padding: .9rem 1rem; }
  .card .k { color: var(--muted); font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; }
  .card .v { font-size: 1.5rem; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: .2rem; }
  .card .n { color: var(--muted); font-size: .78rem; margin-top: .15rem; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: .5rem; padding: 1.25rem 1.25rem 1.5rem; margin-bottom: 1.25rem; }
  h2 { font-size: .95rem; font-weight: 600; margin: 0 0 1rem; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: .5rem .6rem; border-bottom: 1px solid var(--line); font-size: .87rem; }
  th:first-child, td:first-child { text-align: left; }
  /* Keep dates and model IDs on one line; the table scrolls instead of wrapping. */
  .scroll { overflow-x: auto; }
  .scroll table { min-width: 46rem; }
  .scroll td:first-child, .scroll td:nth-child(2) { white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; font-size: .75rem; text-transform: uppercase; letter-spacing: .04em; }
  tbody tr:last-child td { border-bottom: 0; }
  td.num { text-align: right; }
  .model { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: .82rem; }
  /* Stacked bar: cache reads against uncached input, per day. */
  .bar { display: flex; height: 1.4rem; border-radius: .25rem; overflow: hidden; background: var(--accent-soft); min-width: 12rem; }
  .bar .cached { background: var(--cache); }
  .bar .fresh { background: var(--accent); }
  .legend { display: flex; gap: 1.1rem; font-size: .78rem; color: var(--muted); margin-bottom: .9rem; }
  .legend span { display: flex; align-items: center; gap: .35rem; }
  .swatch { width: .7rem; height: .7rem; border-radius: .15rem; display: inline-block; }
  .dayrow td { padding: .7rem .6rem; }
  .daylabel { font-weight: 500; }
  .empty { color: var(--muted); font-size: .87rem; padding: .5rem 0; }
  footer { color: var(--muted); font-size: .78rem; margin-top: 2rem; }
  code { font-family: ui-monospace, Menlo, monospace; font-size: .82em; }
</style>
</head>
<body>
<main>
  <h1>Codex token usage</h1>
  <p class="sub" id="sub"></p>

  <div class="cards" id="cards"></div>

  <section>
    <h2>Cached vs uncached input per day</h2>
    <div class="legend">
      <span><i class="swatch" style="background:var(--cache)"></i> cached input tokens</span>
      <span><i class="swatch" style="background:var(--accent)"></i> uncached input tokens</span>
    </div>
    <table>
      <thead>
        <tr><th>Day (WIB)</th><th>Requests</th><th>Cached</th><th>Hit rate</th><th style="width:45%">Composition</th></tr>
      </thead>
      <tbody id="days"></tbody>
    </table>
  </section>

  <section>
    <h2>Per model, per day</h2>
    <div class="scroll">
    <table>
      <thead>
        <tr>
          <th>Day</th><th>Model</th><th>Requests</th>
          <th>Cached</th><th>Cache write</th><th>Input</th><th>Output</th><th>Reasoning</th><th>Hit rate</th>
        </tr>
      </thead>
      <tbody id="models"></tbody>
    </table>
    </div>
  </section>

  <footer id="foot"></footer>
</main>

<script>
const DATA = __DATA__;

const fmt = n => n.toLocaleString('en-US');
const pct = (c, i) => i > 0 ? (100 * c / i).toFixed(1) + '%' : '—';

function aggregate(rows) {
  const days = new Map();
  for (const r of rows) {
    if (!days.has(r.day)) days.set(r.day, { cached: 0, input: 0, output: 0, requests: 0 });
    const d = days.get(r.day);
    d.cached += r.cached_input_tokens;
    d.input += r.input_tokens;
    d.output += r.output_tokens;
    d.requests += r.requests;
  }
  return days;
}

function render() {
  const rows = DATA.rows;
  document.getElementById('sub').textContent =
    `${rows.length} thread-days across ${DATA.homes.length} Codex home(s) · days are WIB (UTC+7) · collected ${DATA.generated_at.replace('T', ' ')}`;

  if (rows.length === 0) {
    document.getElementById('cards').innerHTML =
      '<div class="card"><div class="k">No usage yet</div><div class="v">0</div>' +
      '<div class="n">No rollout files with token records were found.</div></div>';
    document.getElementById('foot').textContent = 'Run collect.py against a Codex home that has sessions.';
    return;
  }

  const days = aggregate(rows);
  const totals = [...days.values()].reduce((a, d) => ({
    cached: a.cached + d.cached, input: a.input + d.input,
    output: a.output + d.output, requests: a.requests + d.requests
  }), { cached: 0, input: 0, output: 0, requests: 0 });

  const models = new Set(rows.map(r => r.model));
  const card = (k, v, n) => `<div class="card"><div class="k">${k}</div><div class="v">${v}</div><div class="n">${n}</div></div>`;
  document.getElementById('cards').innerHTML = [
    card('Cached input', fmt(totals.cached), `${pct(totals.cached, totals.input)} of input`),
    card('Uncached input', fmt(totals.input - totals.cached), 'billed at full rate'),
    card('Output', fmt(totals.output), 'includes reasoning'),
    card('Requests', fmt(totals.requests), `${days.size} day(s)`),
    card('Models', String(models.size), [...models].join(', ') || '—')
  ].join('');

  const maxTotal = Math.max(...[...days.values()].map(d => d.input));
  document.getElementById('days').innerHTML = [...days.entries()].sort().reverse().map(([day, d]) => {
    const uncached = d.input - d.cached;
    const cw = Math.round(100 * d.cached / maxTotal);
    const uw = Math.round(100 * uncached / maxTotal);
    return `<tr class="dayrow">
      <td class="daylabel">${day}</td>
      <td class="num">${fmt(d.requests)}</td>
      <td class="num">${fmt(d.cached)}</td>
      <td class="num">${pct(d.cached, d.input)}</td>
      <td><div class="bar" title="cached ${fmt(d.cached)} / uncached ${fmt(uncached)}">
        <div class="cached" style="width:${cw}%"></div>
        <div class="fresh" style="width:${uw}%"></div>
      </div></td>
    </tr>`;
  }).join('');

  document.getElementById('models').innerHTML = rows
    .slice()
    .sort((a, b) => a.day.localeCompare(b.day) || b.cached_input_tokens - a.cached_input_tokens)
    .map(r => `<tr>
      <td>${r.day}</td>
      <td class="model">${r.model}</td>
      <td class="num">${fmt(r.requests)}</td>
      <td class="num">${fmt(r.cached_input_tokens)}</td>
      <td class="num">${fmt(r.cache_write_input_tokens)}</td>
      <td class="num">${fmt(r.input_tokens)}</td>
      <td class="num">${fmt(r.output_tokens)}</td>
      <td class="num">${fmt(r.reasoning_output_tokens)}</td>
      <td class="num">${pct(r.cached_input_tokens, r.input_tokens)}</td>
    </tr>`).join('');

  // innerHTML, not textContent: the source note carries <code> markup.
  document.getElementById('foot').innerHTML =
    'Source: <code>sessions/YYYY/MM/DD/rollout-*.jsonl</code>, <code>token_usage_record.usage</code> only; ' +
    'turn and thread totals are cumulative and are not summed. ' +
    'Homes: ' + DATA.homes.map(h => `<code>${h}</code>`).join(', ');
}

render();
</script>
</body>
</html>
