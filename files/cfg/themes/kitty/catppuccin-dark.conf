foreground #cdd6f4
background #1e1e2e
selection_foreground #cdd6f4
selection_background #333c57

cursor #cdd6f4
cursor_text_color #1e1e2e

# Lets a reload change the background opacity, as Glassy windows do, since
# kitty only allows that when this is on from launch.
dynamic_background_opacity yes

active_border_color #89b4fa
# Monochrome tabs. The active tab inverts the text colors, and kitty.conf
# draws its title in bold.
active_tab_foreground #1e1e2e
active_tab_background #cdd6f4
inactive_tab_foreground #cdd6f4
inactive_tab_background #313244

