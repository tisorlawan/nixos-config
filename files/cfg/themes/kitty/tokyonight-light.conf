foreground #3760bf
background #e1e2e7
selection_foreground #3760bf
selection_background #bdcee7

cursor #3760bf
cursor_text_color #e1e2e7

# See-through in dark mode, like Tern, and opaque in light mode. Dynamic
# opacity lets a reload change it in running windows, which kitty allows only
# when the option is on from launch.
background_opacity 1
dynamic_background_opacity yes

active_border_color #2e7de9
# Monochrome tabs. The active tab inverts the text colors, and kitty.conf
# draws its title in bold.
active_tab_foreground #e1e2e7
active_tab_background #3760bf
inactive_tab_foreground #3760bf
inactive_tab_background #c4c8da

